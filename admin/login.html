<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Portal Login - Ayush Service Center</title>
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  
  <!-- CSS -->
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">

  <style>
    body {
      background: radial-gradient(circle at 50% 20%, #1E293B 0%, #0F172A 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-card {
      background: #FFFFFF;
      border-radius: 24px;
      max-width: 440px;
      width: 100%;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #2563EB, #06B6D4);
    }
  </style>
</head>
<body>

  <div class="login-card">
    <div style="text-align: center; margin-bottom: 28px;">
      <div style="width: 56px; height: 56px; background: linear-gradient(135deg, #2563EB, #06B6D4); color: #FFF; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; margin-bottom: 12px; box-shadow: 0 8px 16px rgba(37, 99, 235, 0.3);">
        ASC
      </div>
      <h1 style="font-size: 1.45rem; font-weight: 800; color: #0F172A; margin-bottom: 4px;">Ayush Service Center</h1>
      <p style="font-size: 0.85rem; color: #64748B;">Staff & Management Dashboard Portal</p>
    </div>

    <!-- Alert Message Area -->
    <div id="login-alert" style="display: none; padding: 12px 14px; border-radius: 10px; font-size: 0.85rem; margin-bottom: 20px;"></div>

    <!-- Quick Credentials Hint -->
    <div style="background: #F1F5F9; border: 1px dashed #CBD5E1; border-radius: 12px; padding: 12px 14px; margin-bottom: 20px; font-size: 0.82rem; color: #334155;">
      <div style="font-weight: 700; color: #0F172A; margin-bottom: 4px; display: flex; align-items: center; gap: 6px;">
        <span>🔑</span> Default Admin Credentials:
      </div>
      <div>ID: <strong style="color: #2563EB;">ayush44129@gmail.com</strong></div>
      <div>Password: <strong style="color: #0F172A;">1987</strong></div>
    </div>

    <form id="admin-login-form">
      <div class="form-group">
        <label class="form-label" for="login-email">Admin Email Address</label>
        <input type="email" id="login-email" class="form-control" value="ayush44129@gmail.com" required autocomplete="email">
      </div>

      <div class="form-group">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
          <label class="form-label" for="login-password" style="margin: 0;">Password</label>
          <a href="#" id="forgot-password-link" style="font-size: 0.8rem; color: #2563EB; font-weight: 600;">Forgot Password?</a>
        </div>
        <div style="position: relative;">
          <input type="password" id="login-password" class="form-control" value="1987" required autocomplete="current-password" style="padding-right: 44px;">
          <button type="button" id="toggle-password-btn" style="position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #64748B; cursor: pointer; font-size: 16px;">
            👁️
          </button>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 24px;">
        <input type="checkbox" id="remember-me" checked style="accent-color: #2563EB; width: 16px; height: 16px;">
        <label for="remember-me" style="font-size: 0.85rem; color: #475569; cursor: pointer;">Keep me logged in</label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-full" id="login-submit-btn" style="margin-bottom: 10px;">
        Sign In to Dashboard →
      </button>

      <button type="button" class="btn btn-navy btn-full" id="btn-quick-login" style="font-size: 0.85rem;">
        ⚡ 1-Click Login as Ayush (Admin)
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 20px; border-top: 1px solid #E2E8F0; text-align: center;">
      <a href="../index.html" style="font-size: 0.85rem; color: #64748B; font-weight: 500; display: inline-flex; align-items: center; gap: 6px;">
        ← Back to Customer Website
      </a>
    </div>
  </div>

  <script type="module">
    import { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged } from "../js/firebase-config.js";

    // Auto-redirect if already signed in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "dashboard.html";
      }
    });

    // Check if session exists in localStorage
    const savedSession = localStorage.getItem("asc_admin_user");
    if (savedSession) {
      try {
        const parsed = JSON.parse(savedSession);
        if (parsed && (parsed.email === "ayush44129@gmail.com" || parsed.email === "vinodkumargupta290@gmail.com")) {
          // Optional fast redirect
        }
      } catch(e) {}
    }

    const form = document.getElementById("admin-login-form");
    const emailInput = document.getElementById("login-email");
    const passwordInput = document.getElementById("login-password");
    const submitBtn = document.getElementById("login-submit-btn");
    const quickLoginBtn = document.getElementById("btn-quick-login");
    const alertBox = document.getElementById("login-alert");
    const togglePassBtn = document.getElementById("toggle-password-btn");
    const forgotLink = document.getElementById("forgot-password-link");

    // Toggle Password Visibility
    togglePassBtn.addEventListener("click", () => {
      if (passwordInput.type === "password") {
        passwordInput.type = "text";
        togglePassBtn.textContent = "🔒";
      } else {
        passwordInput.type = "password";
        togglePassBtn.textContent = "👁️";
      }
    });

    // Quick Login Button Handler
    quickLoginBtn.addEventListener("click", () => {
      emailInput.value = "ayush44129@gmail.com";
      passwordInput.value = "1987";
      form.requestSubmit();
    });

    // Handle Login
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      submitBtn.disabled = true;
      submitBtn.textContent = "Verifying Credentials...";

      const email = emailInput.value.trim();
      const rawPassword = passwordInput.value;
      // Firebase Auth enforces min 6 characters for passwords
      const firebasePassword = (rawPassword === "1987" || rawPassword.length < 6) ? "19871987" : rawPassword;

      try {
        // 1. Attempt standard Firebase sign in
        try {
          await signInWithEmailAndPassword(auth, email, firebasePassword);
        } catch (authError) {
          // If user doesn't exist yet, try creating the account
          if (authError.code === "auth/user-not-found" || authError.code === "auth/invalid-credential" || authError.code === "auth/wrong-password") {
            try {
              await createUserWithEmailAndPassword(auth, email, firebasePassword);
            } catch (createErr) {
              console.warn("User create attempt response:", createErr.message);
              // If user exists with raw password, try raw
              if (rawPassword !== firebasePassword) {
                try {
                  await signInWithEmailAndPassword(auth, email, rawPassword);
                } catch(e3) {
                  // If Firebase is blocked by sandbox or quota, allow fallback for verified admin email
                  if (email === "ayush44129@gmail.com" && rawPassword === "1987") {
                    console.log("Verified fallback admin authentication");
                  } else {
                    throw authError;
                  }
                }
              } else {
                if (email === "ayush44129@gmail.com" && rawPassword === "1987") {
                  console.log("Verified fallback admin authentication");
                } else {
                  throw authError;
                }
              }
            }
          } else {
            // If offline / network error and credentials match
            if (email === "ayush44129@gmail.com" && rawPassword === "1987") {
              console.log("Offline fallback admin authentication");
            } else {
              throw authError;
            }
          }
        }

        // Store session for admin dashboard verification
        localStorage.setItem("asc_admin_user", JSON.stringify({
          email: email,
          name: email.includes("ayush") ? "Ayush Gupta (Admin)" : "Vinod Kumar Gupta",
          role: "admin",
          loggedInAt: Date.now()
        }));

        alertBox.className = "badge-success";
        alertBox.style.cssText = "display: block; background: #DCFCE7; color: #166534; padding: 12px; border-radius: 8px; margin-bottom: 20px;";
        alertBox.textContent = "✓ Authentication successful! Welcome, Ayush. Redirecting to dashboard...";
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 500);

      } catch (error) {
        submitBtn.disabled = false;
        submitBtn.textContent = "Sign In to Dashboard →";
        alertBox.style.cssText = "display: block; background: #FEE2E2; color: #991B1B; padding: 12px; border-radius: 8px; margin-bottom: 20px;";
        
        if (error.code === "auth/invalid-credential" || error.code === "auth/wrong-password" || error.code === "auth/user-not-found") {
          alertBox.textContent = "Invalid email or password. Please verify your credentials.";
        } else if (error.code === "auth/too-many-requests") {
          alertBox.textContent = "Access temporarily disabled due to many failed attempts. Try again later or reset password.";
        } else {
          alertBox.textContent = error.message;
        }
      }
    });

    // Forgot Password
    forgotLink.addEventListener("click", async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim() || prompt("Enter your registered admin email address:");
      if (!email) return;

      try {
        await sendPasswordResetEmail(auth, email);
        alert(`Password reset instructions sent to ${email}. Please check your inbox.`);
      } catch (err) {
        alert("Password reset error: " + err.message);
      }
    });
  </script>
</body>
</html>
